[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoguard-ai"
version = "0.1.0"
description = "Prototype geofence and telemetry API for simulation and research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AutoGuard-AI contributors" }]
keywords = ["geofence", "telemetry", "fastapi", "prototype", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110,<1",
  "prometheus-client>=0.20,<1",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = [
  "coverage>=7.4,<8",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pytest>=8.1,<10",
  "pytest-benchmark>=5,<6",
  "pytest-cov>=5,<8",
  "scipy>=1.13,<2",
]
full = [
  "grpcio>=1.62,<2",
  "grpcio-tools>=1.62,<2",
  "gymnasium>=0.29,<2",
  "kafka-python>=2.0,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "opentelemetry-api>=1.24,<2",
  "opentelemetry-sdk>=1.24,<2",
  "pandas>=2.2,<4",
  "redis>=5.0,<6",
  "scipy>=1.13,<2",
  "snowflake-connector-python>=3.8,<4",
  "stable-baselines3>=2.3,<3",
  "streamlit>=1.35,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.urls]
Homepage = "https://github.com/CoreyLeath-code/AutoGuard-AI-Real-Time-Autonomous-Vehicle-Safety-Geofencing-Platform"
Documentation = "https://github.com/CoreyLeath-code/AutoGuard-AI-Real-Time-Autonomous-Vehicle-Safety-Geofencing-Platform/tree/main/docs"
Source = "https://github.com/CoreyLeath-code/AutoGuard-AI-Real-Time-Autonomous-Vehicle-Safety-Geofencing-Platform"
Issues = "https://github.com/CoreyLeath-code/AutoGuard-AI-Real-Time-Autonomous-Vehicle-Safety-Geofencing-Platform/issues"

[tool.setuptools.packages.find]
include = ["agents*", "apps*", "libs*", "services*"]
exclude = ["tests*", "cuda*"]

[tool.setuptools]
include-package-data = false

[tool.black]
target-version = ["py311"]
