name: Publish Docker Image

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-api:${{ github.ref_name }},${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-api:latest
          cache-from: type=gha,scope=autoguard-api
          cache-to: type=gha,mode=max,scope=autoguard-api

      - name: Build and Push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-dashboard:${{ github.ref_name }},${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-dashboard:latest
          cache-from: type=gha,scope=autoguard-dashboard
          cache-to: type=gha,mode=max,scope=autoguard-dashboard

      - name: Add Publish Summary
        if: always()
        run: |
          {
            echo "## Docker publish"
            echo
            echo "- API image: ${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-api:${{ github.ref_name }}"
            echo "- Dashboard image: ${{ env.REGISTRY }}/${{ env.OWNER }}/autoguard-dashboard:${{ github.ref_name }}"
            echo "- Build cache: GitHub Actions cache via Buildx"
          } >> "$GITHUB_STEP_SUMMARY"
