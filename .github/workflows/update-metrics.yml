name: Generate Repository Inventory Summary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-inventory:
    name: Generate Repository Inventory Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate inventory summary
        run: python scripts/generate_metrics_table.py > repository-inventory.md

      - name: Validate generated inventory
        run: |
          test -s repository-inventory.md
          grep -Fq "## Repository inventory" repository-inventory.md
          grep -Fq "not a performance, safety, accuracy, or quality metric" repository-inventory.md
          git diff --check

      - name: Publish workflow summary
        run: cat repository-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-inventory-${{ github.sha }}
          path: repository-inventory.md
          if-no-files-found: error
          retention-days: 30
