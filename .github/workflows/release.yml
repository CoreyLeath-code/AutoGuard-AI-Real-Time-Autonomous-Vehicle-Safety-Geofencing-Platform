name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install build twine pytest-cov pip-audit
          python -m pip check

      - name: Audit release dependencies
        run: python -m pip_audit -r requirements-ci.txt

      - name: Run release test gate
        run: |
          PYTHONPATH=. pytest tests \
            --ignore=tests/benchmarks \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-results.xml \
            --cov-fail-under=85

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            coverage.xml
            pytest-results.xml

      - name: Add Release Summary
        if: always()
        run: |
          {
            echo "## Release"
            echo
            echo "- Tag: ${{ github.ref_name }}"
            echo "- Artifacts: source distribution, wheel, SHA256SUMS, coverage.xml, pytest-results.xml"
            echo "- Release tests: Python 3.11 with an 85% coverage gate"
            echo "- Provenance: GitHub build attestation for dist artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
