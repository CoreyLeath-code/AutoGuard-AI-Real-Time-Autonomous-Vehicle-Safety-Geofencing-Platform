name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Add Release Summary
        if: always()
        run: |
          {
            echo "## Release"
            echo
            echo "- Tag: ${{ github.ref_name }}"
            echo "- Release notes: generated by softprops/action-gh-release"
          } >> "$GITHUB_STEP_SUMMARY"
