name: Generate SBOM

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0

      - name: Add SBOM Summary
        if: always()
        run: |
          {
            echo "## SBOM"
            echo
            echo "- Generator: anchore/sbom-action"
            echo "- Source ref: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
