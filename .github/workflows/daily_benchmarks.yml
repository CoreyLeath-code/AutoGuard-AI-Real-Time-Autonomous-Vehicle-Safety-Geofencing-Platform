name: Daily Performance Benchmarks

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install pytest-benchmark
          python -m pip check

      - name: Run Geofencing Benchmarks
        run: |
          rm -f output.json
          PYTHONPATH=. pytest tests/benchmarks/test_geofence_benchmark.py \
            --benchmark-only \
            --benchmark-json=output.json

      - name: Validate Benchmark JSON
        run: python scripts/validate_benchmark_json.py output.json

      - name: Add Benchmark Summary
        if: always()
        run: |
          {
            echo "## Benchmark run"
            echo
            if [ -s output.json ]; then
              python scripts/validate_benchmark_json.py output.json --summary
            else
              echo "- output.json was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: AutoGuard Performance Index
          tool: 'pytest'
          output-file-path: output.json
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          summary-always: true
