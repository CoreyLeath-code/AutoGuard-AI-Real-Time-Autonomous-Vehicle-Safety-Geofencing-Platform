name: Daily Performance Benchmarks

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest-benchmark
          pip check

      - name: Run Benchmarks
        run: |
          rm -f output.json
          PYTHONPATH=. pytest \
            tests/benchmarks/test_geofence_benchmark.py \
            --benchmark-only \
            --benchmark-json=output.json

      - name: Validate Benchmark Output
        run: |
          python scripts/validate_benchmark_json.py output.json

      - name: Benchmark Summary
        if: always()
        run: |
          echo "## Daily Benchmark Results" >> $GITHUB_STEP_SUMMARY
          python scripts/validate_benchmark_json.py output.json --summary >> $GITHUB_STEP_SUMMARY

      - name: Ensure gh-pages Branch Exists
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "gh-pages exists."
          else
            echo "Creating gh-pages branch..."

            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git -c user.name="github-actions" \
                -c user.email="github-actions@users.noreply.github.com" \
                commit -m "Initialize gh-pages"

            git push origin gh-pages
            git checkout "${GITHUB_REF_NAME}"
          fi

      - name: Publish Benchmark History
        uses: benchmark-action/github-action-benchmark@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tool: pytest
          output-file-path: output.json
          benchmark-data-dir-path: dev/bench
          gh-pages-branch: gh-pages
          auto-push: true
          summary-always: true
          comment-on-alert: true
          fail-on-alert: false

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: output.json
          retention-days: 30